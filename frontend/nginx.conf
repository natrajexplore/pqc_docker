# Serves the built UI and proxies /api + /ws to the backend on the mgmt network.
# Runs unprivileged on 8080 with a read-only root filesystem (see compose).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  client_max_body_size 50m;           # pcap imports
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;
  # $request_id is forwarded to the backend as X-Request-ID, so one id ties this
  # line to every backend log line the request produced.
  log_format pqcw '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time rid=$request_id';
  access_log /dev/stdout pqcw;
  error_log  /dev/stderr warn;
  server_tokens off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # $http_host (with port), not $host: the backend checks that a browser's Origin
    # equals Host exactly (CSRF / DNS-rebinding guard in backend/app/middleware.py).
    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 120s;
    }
    location /ws/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-ID $request_id;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
    location / {
      try_files $uri /index.html;
    }
  }
}

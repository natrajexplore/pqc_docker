id: tls-auth-ecdsa-mtls
title: "TLS 1.3 mutual auth, classical: ECDSA certificates"
protocol: tls
stack: tls
pillar: authentication
group: tls-auth
order: 10
summary: >
  Mutual TLS with ECDSA P-256 certificates over a hybrid key exchange. In TLS 1.3
  the Certificate and CertificateVerify messages are encrypted, so the lab key log
  is used (lab only!) to decrypt them and read the certificate algorithm off the wire.
upstream_lab: learn/tls/authentication
nodes:
  server: pqcw-tls-server
  client: pqcw-tls-client
endpoints:
  left:  {name: Client, ip: 172.32.0.3}
  right: {name: Server, ip: 172.32.0.2}
capture:
  agent: pqcw-cap-tls
  host: tls-server
  bpf: "tcp port 4433"
keylog: {node: client, path: /tmp/tls.keys}
declared:
  key_exchange: pq-hybrid
  authentication: classical
  authentication_algorithm: ECDSA P-256 (mutual)
steps:
  - id: pki
    title: Mint ECDSA CA, server and client certificates
    exec:
      - {node: server, cmd: "sh /pqcw/tls-pki.sh gen ecdsa && sh /pqcw/tls-pki.sh activate ecdsa && sh /pqcw/tls-pki.sh sizes ecdsa", timeout: 60}
  - id: server
    title: Start openssl s_server requiring a client certificate
    exec:
      - {node: server, cmd: "pkill -f 'openssl s_server' ; sleep 0.3; true"}
      - {node: server, detach: true,
         cmd: "openssl s_server -accept 172.32.0.2:4433 -www -tls1_3 -groups X25519MLKEM768:x25519 -cert /pki/active/server.crt -key /pki/active/server.key -CAfile /pki/active/ca.crt -Verify 1 -verify_return_error > /tmp/s_server.log 2>&1"}
  - id: server-ready
    title: Wait for the listener
    action: wait_for
    wait_for: {node: server, cmd: "ss -ltn", regex: "172.32.0.2:4433"}
  - id: capture-start
    title: Start capturing on the server's interface
    action: capture_start
  - id: handshake
    title: Mutual TLS handshake
    exec:
      - node: client
        timeout: 20
        cmd: >-
          rm -f /tmp/tls.keys;
          printf 'GET / HTTP/1.0\r\n\r\n' | openssl s_client -connect 172.32.0.2:4433 -tls1_3
          -groups X25519MLKEM768:x25519 -CAfile /pki/active/ca.crt -verify_return_error
          -verify_hostname server.pqcw.lab -servername server.pqcw.lab
          -cert /pki/active/client.crt -key /pki/active/client.key
          -keylogfile /tmp/tls.keys -ign_eof 2>&1
    expect: {regex: "Verify return code: 0 \\(ok\\)"}
  - id: capture-stop
    title: Stop the capture
    action: capture_stop
cleanup:
  - id: stop-server
    title: Stop s_server
    exec:
      - {node: server, cmd: "pkill -f 'openssl s_server'; true"}
assertions:
  - {id: group, kind: tls.server_group, expect: {group: X25519MLKEM768}}
  - {id: auth-wire, kind: tls.decrypted_cert_pq, expect: {post_quantum: false},
     description: "Decrypted Certificate messages carry ECDSA keys/signatures"}
expected_numbers:
  note: "Compare total handshake bytes with tls-auth-mldsa65-mtls."

id: macsec-downgrade-pinned-client
title: "MACsec / 802.1X: client pins TLS 1.3 - downgrade becomes a loud failure"
protocol: macsec
stack: macsec
pillar: key-exchange
group: macsec
order: 40
summary: >
  The defence for the previous scenario. Same misconfigured hostapd, but the supplicant
  pins TLS 1.3 (phase1 tls_disable_tlsv1_2=1). The server can no longer drag the
  session down to classical: there is no ServerHello at all and EAP fails. Failing
  closed is the outcome you want, so this run is green.
upstream_lab: learn/macsec
nodes:
  authenticator: pqcw-macsec-authenticator
  supplicant: pqcw-macsec-supplicant
endpoints:
  left:  {name: Supplicant, mac: "${sup_mac}"}
  right: {name: Authenticator, mac: "${aut_mac}"}
capture:
  agent: pqcw-cap-macsec
  host: macsec-authenticator
  bpf: "ether proto 0x888e or ether proto 0x88e5"
declared:
  key_exchange: refused
  authentication: classical
  authentication_algorithm: ECDSA P-256
steps:
  - id: pki
    title: Use ECDSA EAP certificates
    exec:
      - {node: authenticator, cmd: "sh /pqcw/tls-pki.sh gen ecdsa && sh /pqcw/tls-pki.sh activate ecdsa", timeout: 60}
  - id: sup-mac
    title: Learn the supplicant port MAC
    action: resolve
    var: sup_mac
    exec:
      - {node: authenticator, cmd: [cat, /sys/class/net/sup/address]}
  - id: aut-mac
    title: Learn the authenticator port MAC
    action: resolve
    var: aut_mac
    exec:
      - {node: authenticator, cmd: [cat, /sys/class/net/aut/address]}
  - id: reset
    title: Stop any previous 802.1X daemons
    exec:
      - {node: authenticator, cmd: "pkill hostapd; true"}
      - {node: supplicant, cmd: "pkill wpa_supplicant; rm -f /tmp/wpa.log; true"}
  - id: hostapd
    title: Start the misconfigured hostapd (no tls_flags)
    exec:
      - {node: authenticator, detach: true, cmd: "hostapd -dd /pqcw/cfg/hostapd-tls12-downgrade.conf > /tmp/hostapd.log 2>&1"}
  - id: hostapd-ready
    title: Wait for the authenticator port to come up
    action: wait_for
    wait_for: {node: authenticator, cmd: "grep -a -E 'AP-ENABLED|interface state .*ENABLED' /tmp/hostapd.log || true", regex: "ENABLED", timeout: 10}
  - id: capture-start
    title: Start capturing EAPOL on the aut port
    action: capture_start
  - id: supplicant
    title: Start wpa_supplicant with TLS 1.3 pinned
    exec:
      - {node: supplicant, detach: true, cmd: "wpa_supplicant -Dwired -isup -c /pqcw/cfg/wpa_supplicant-pin13.conf -t -dd > /tmp/wpa.log 2>&1"}
  - id: eap-result
    title: Wait for EAP result
    action: wait_for
    wait_for: {node: supplicant, cmd: "grep -a -E 'CTRL-EVENT-EAP-(SUCCESS|FAILURE)|protocol version|alert' /tmp/wpa.log || true", regex: "CTRL-EVENT-EAP-FAILURE|protocol version", timeout: 25}
  - id: milestones
    title: The endpoint's view
    exec:
      - {node: supplicant, cmd: "grep -aiE 'alert|protocol version|CTRL-EVENT-EAP-(SUCCESS|FAILURE)' /tmp/wpa.log | uniq | head -20"}
  - id: settle
    title: Let the last EAPOL frames land
    action: sleep
    seconds: 1
  - id: capture-stop
    title: Stop the capture
    action: capture_stop
cleanup:
  - id: stop-daemons
    title: Stop hostapd and wpa_supplicant
    exec:
      - {node: supplicant, cmd: "pkill wpa_supplicant; true"}
      - {node: authenticator, cmd: "pkill hostapd; true"}
assertions:
  - {id: client-offered-pq, kind: tls.client_offers_group, expect: {group: X25519MLKEM768}}
  - {id: no-server-hello, kind: count, expect: {proto: EAP-TLS, tag: classical-kex, max: 0},
     description: "No classical ServerHello was ever accepted"}
  - {id: no-success, kind: step_output, expect: {step: milestones, regex: "CTRL-EVENT-EAP-SUCCESS", absent: true},
     description: "EAP did not succeed - fail closed"}
expected_numbers:
  note: "Pair this with macsec-downgrade-tls12 in the compare view: silent vs loud."

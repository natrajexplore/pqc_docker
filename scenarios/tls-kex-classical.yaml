id: tls-kex-classical
title: "TLS 1.3 classical baseline: x25519"
protocol: tls
stack: tls
pillar: key-exchange
group: tls-kex
order: 10
summary: >
  A TLS 1.3 handshake restricted to the classical x25519 group. The ClientHello key
  share is 32 bytes. This is what most of the web looked like before 2024 - and
  what every recorded session still looks like to a future quantum adversary.
upstream_lab: learn/tls/key-exchange
nodes:
  server: pqcw-tls-server
  client: pqcw-tls-client
endpoints:
  left:  {name: Client, ip: 172.32.0.3}
  right: {name: Server, ip: 172.32.0.2}
capture:
  agent: pqcw-cap-tls
  host: tls-server
  bpf: "tcp port 4433"
keylog: {node: client, path: /tmp/tls.keys}
declared:
  key_exchange: classical
  authentication: classical
  authentication_algorithm: ECDSA P-256 (server only)
steps:
  - id: pki
    title: Mint an ECDSA server certificate
    exec:
      - {node: server, cmd: "sh /pqcw/tls-pki.sh gen ecdsa && sh /pqcw/tls-pki.sh activate ecdsa", timeout: 60}
  - id: server
    title: Start openssl s_server (x25519 only)
    exec:
      - {node: server, cmd: "pkill -f '[o]penssl s_server' ; sleep 0.3; true"}
      - {node: server, detach: true,
         cmd: "openssl s_server -accept 172.32.0.2:4433 -www -tls1_3 -groups x25519 -cert /pki/active/server.crt -key /pki/active/server.key > /tmp/s_server.log 2>&1"}
  - id: server-ready
    title: Wait for the listener
    action: wait_for
    wait_for: {node: server, cmd: "ss -ltn", regex: "172.32.0.2:4433"}
  - id: capture-start
    title: Start capturing on the server's interface
    action: capture_start
  - id: handshake
    title: Connect with openssl s_client and fetch a page
    narration: The request and response travel as encrypted application_data records.
    exec:
      - node: client
        timeout: 20
        cmd: >-
          rm -f /tmp/tls.keys;
          printf 'GET / HTTP/1.0\r\n\r\n' | openssl s_client -connect 172.32.0.2:4433 -tls1_3
          -groups x25519 -CAfile /pki/active/ca.crt -verify_return_error
          -verify_hostname server.pqcw.lab -servername server.pqcw.lab
          -keylogfile /tmp/tls.keys -ign_eof 2>&1
    expect: {regex: "Verify return code: 0 \\(ok\\)"}
  - id: capture-stop
    title: Stop the capture
    action: capture_stop
cleanup:
  - id: stop-server
    title: Stop s_server
    exec:
      - {node: server, cmd: "pkill -f '[o]penssl s_server'; true"}
assertions:
  - {id: group, kind: tls.server_group, expect: {group: x25519}}
  - {id: version, kind: tls.version, expect: {version: "TLS 1.3"}}
  - {id: encrypted-data, kind: count, expect: {proto: TLS, tag: encrypted, min: 2}}
expected_numbers:
  client_key_share_bytes: 32
  server_key_share_bytes: 32
  observed: "2026-10-29, OpenSSL 3.5.7, Wireshark 4.4; key share / certificate sizes are exact, frame bytes depend on TCP segmentation (veth GRO coalesces segments above MTU)"
  client_key_share_bytes_observed: 32
  server_key_share_bytes_observed: 32
  hello_frames_bytes: 1280

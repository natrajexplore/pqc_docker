id: macsec-eaptls-ecdsa
title: "MACsec / 802.1X: EAP-TLS 1.3 with hybrid ML-KEM, ECDSA certificates"
protocol: macsec
stack: macsec
pillar: key-exchange
group: macsec
order: 10
summary: >
  MACsec's data plane is AES-GCM and already quantum-resistant; its exposure is the
  EAP-TLS handshake that roots the MSK -> CAK -> SAK key hierarchy. With TLS 1.3
  enabled on both ends, OpenSSL 3.5 negotiates X25519MLKEM768 inside EAPOL by
  default. ECDSA certificates keep the exchange compact (upstream measured 14 frames).
upstream_lab: learn/macsec
nodes:
  authenticator: pqcw-macsec-authenticator
  supplicant: pqcw-macsec-supplicant
endpoints:
  left:  {name: Supplicant, mac: "${sup_mac}"}
  right: {name: Authenticator, mac: "${aut_mac}"}
capture:
  agent: pqcw-cap-macsec
  host: macsec-authenticator
  bpf: "ether proto 0x888e or ether proto 0x88e5"
declared:
  key_exchange: pq-hybrid
  authentication: classical
  authentication_algorithm: ECDSA P-256 (EAP server + supplicant)
steps:
  - id: pki
    title: Mint ECDSA EAP certificates
    exec:
      - {node: authenticator, cmd: "sh /pqcw/tls-pki.sh gen ecdsa && sh /pqcw/tls-pki.sh activate ecdsa && sh /pqcw/tls-pki.sh sizes ecdsa", timeout: 60}
  - id: sup-mac
    title: Learn the supplicant port MAC
    action: resolve
    var: sup_mac
    exec:
      - {node: authenticator, cmd: [cat, /sys/class/net/sup/address]}
  - id: aut-mac
    title: Learn the authenticator port MAC
    action: resolve
    var: aut_mac
    exec:
      - {node: authenticator, cmd: [cat, /sys/class/net/aut/address]}
  - id: reset
    title: Stop any previous 802.1X daemons
    exec:
      - {node: authenticator, cmd: "pkill hostapd; true"}
      - {node: supplicant, cmd: "pkill wpa_supplicant; rm -f /tmp/wpa.log; true"}
  - id: hostapd
    title: Start hostapd (EAP-TLS server, TLS 1.3 enabled)
    narration: "tls_flags=[ENABLE-TLSv1.3]... hostapd disables TLS 1.3 for EAP unless told otherwise."
    exec:
      - {node: authenticator, detach: true, cmd: "hostapd -dd /pqcw/cfg/hostapd-tls13.conf > /tmp/hostapd.log 2>&1"}
  - id: hostapd-ready
    title: Wait for the authenticator port to come up
    action: wait_for
    wait_for: {node: authenticator, cmd: "grep -a -E 'AP-ENABLED|interface state .*ENABLED' /tmp/hostapd.log || true", regex: "ENABLED", timeout: 10}
  - id: capture-start
    title: Start capturing EAPOL on the aut port
    action: capture_start
  - id: supplicant
    title: Start wpa_supplicant (EAP-TLS peer)
    exec:
      - {node: supplicant, detach: true, cmd: "wpa_supplicant -Dwired -isup -c /pqcw/cfg/wpa_supplicant.conf -t -dd > /tmp/wpa.log 2>&1"}
  - id: eap-result
    title: Wait for EAP success
    action: wait_for
    wait_for: {node: supplicant, cmd: "grep -a -E 'CTRL-EVENT-EAP-(SUCCESS|FAILURE)' /tmp/wpa.log || true", regex: "CTRL-EVENT-EAP-SUCCESS", timeout: 25}
  - id: milestones
    title: Pull the milestones from the supplicant log
    exec:
      - {node: supplicant, cmd: "grep -aE 'CTRL-EVENT-EAP-METHOD|Using TLS version|CTRL-EVENT-EAP-SUCCESS|CTRL-EVENT-CONNECTED' /tmp/wpa.log | uniq"}
  - id: cert-info
    title: Inspect the supplicant certificate
    exec:
      - {node: supplicant, cmd: "openssl x509 -in /pki/active/client.crt -noout -text | grep -m1 'Public Key Algorithm'"}
  - id: settle
    title: Let the last EAPOL frames land
    action: sleep
    seconds: 1
  - id: capture-stop
    title: Stop the capture
    action: capture_stop
cleanup:
  - id: stop-daemons
    title: Stop hostapd and wpa_supplicant
    exec:
      - {node: supplicant, cmd: "pkill wpa_supplicant; true"}
      - {node: authenticator, cmd: "pkill hostapd; true"}
assertions:
  - {id: group, kind: tls.server_group, expect: {group: X25519MLKEM768},
     description: "EAP-TLS ServerHello key_share is X25519MLKEM768"}
  - {id: version, kind: tls.version, expect: {version: "TLS 1.3"}}
  - {id: tls13-endpoint, kind: step_output, expect: {step: milestones, regex: "TLSv1\\.3"}}
  - {id: frames, kind: eap.frames, expect: {min: 12, max: 16},
     description: "Compact exchange (upstream: 14 EAPOL frames)"}
  - {id: auth-cert, kind: step_output, expect: {step: cert-info, regex: "Public Key Algorithm: id-ecPublicKey"}}
expected_numbers:
  upstream: "14 EAPOL frames, 483 B client cert, 1 client TLS fragment"
  observed: "2026-10-29, hostapd/wpa_supplicant 2.12-devel, OpenSSL 3.5.7, EAPOL over a veth pair (no kernel MACsec on this host)"
  eapol_frames: 14
  eap_fragments_each_way: 1
  leaf_cert_der_bytes: 527
  handshake_bytes: 5340   # varies by a few bytes per run: ECDSA signatures are variable-length DER

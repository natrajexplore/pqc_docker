id: ipsec-auth-mldsa44
title: "IKEv2 mutual auth, post-quantum: ML-DSA-44 certificates"
protocol: ipsec
stack: ipsec-auth
pillar: authentication
group: ipsec-auth
order: 20
summary: >
  Both pillars post-quantum: hybrid ML-KEM-768 key exchange and ML-DSA-44 (FIPS 204)
  certificates. ML-DSA-44 public keys are 1312 bytes and signatures 2420 bytes, so the
  encrypted IKE_AUTH message balloons into several RFC 7383 fragments in each direction.
  Built from strongSwan's experimental ml-dsa branch - this is the frontier.
upstream_lab: learn/ipsec/authentication
learn_more:
  - https://blogs.cisco.com/developer/mutual-post-quantum-auth-over-ikev2-ipsec-series-part-8
nodes:
  initiator: pqcw-ipsec-auth-initiator
  responder: pqcw-ipsec-auth-responder
endpoints:
  left:  {name: Initiator, ip: 172.31.0.2}
  right: {name: Responder, ip: 172.31.0.3}
capture:
  agent: pqcw-cap-ipsec-auth
  host: ipsec-auth-responder
  bpf: "udp port 500 or udp port 4500 or esp or icmp"
declared:
  key_exchange: pq-hybrid
  authentication: pq
  authentication_algorithm: ML-DSA-44
steps:
  - id: reset
    title: Clear any previous tunnel
    exec:
      - {node: initiator, cmd: "swanctl --terminate --ike auth-tunnel --force >/dev/null 2>&1; true", timeout: 15}
  - id: pki
    title: Mint the lab CA and leaf certificates (ML-DSA-44)
    exec:
      - {node: initiator, cmd: [/bin/bash, /pqcw/pki.sh, gen, ml-dsa-44], timeout: 60}
  - id: install
    title: Install each peer's certificate and key
    exec:
      - {node: responder, cmd: [/bin/bash, /pqcw/pki.sh, install, ml-dsa-44, responder]}
      - {node: initiator, cmd: [/bin/bash, /pqcw/pki.sh, install, ml-dsa-44, initiator]}
  - id: cert-info
    title: Inspect the initiator certificate
    narration: Compare the DER size with the ECDSA run - this is the certificate size explosion.
    exec:
      - {node: initiator, cmd: [pki, --print, --in, /usr/local/etc/swanctl/x509/initiator.crt]}
  - id: sizes
    title: Weigh the certificate (DER bytes)
    exec:
      - {node: initiator, cmd: [/bin/bash, /pqcw/pki.sh, sizes, ml-dsa-44]}
  - id: capture-start
    title: Start capturing on the responder's interface
    action: capture_start
  - id: initiate
    title: Initiate with ML-DSA authentication
    narration: Watch IKE_AUTH split into many SKF fragments in both directions.
    exec:
      - {node: initiator, cmd: [swanctl, --initiate, --child, auth-child, --timeout, "25"], timeout: 35}
    expect: {regex: "initiate completed successfully"}
  - id: dataplane
    title: Ping through the tunnel
    exec:
      - {node: initiator, cmd: [ping, -c, "3", -W, "2", 172.31.0.3]}
  - id: list-sas
    title: Show the established SA
    exec:
      - {node: initiator, cmd: [swanctl, --list-sas]}
    expect: {regex: "ESTABLISHED"}
  - id: capture-stop
    title: Stop the capture
    action: capture_stop
cleanup:
  - id: terminate
    title: Tear the tunnel down
    exec:
      - {node: initiator, cmd: "swanctl --terminate --ike auth-tunnel --force; true"}
assertions:
  - {id: kex-addke, kind: ikev2.selected_additional_ke, expect: {methods: [ML_KEM_768]}}
  - {id: ike-auth-fragmented, kind: ikev2.exchange_count, expect: {exchange: IKE_AUTH, min: 10, max: 13},
     description: "ML-DSA certificates push IKE_AUTH into multiple fragments"}
  - {id: auth-cert, kind: step_output, expect: {step: cert-info, regex: 'pubkey:\s+ML_DSA_44 10496 bits'},
     description: "The installed certificate is ML-DSA-44 (endpoint evidence)"}
  - {id: esp, kind: count, expect: {proto: ESP, min: 6}}
expected_numbers:
  ml_dsa_44_public_key_bytes: 1312
  ml_dsa_44_signature_bytes: 2420
  note: "Upstream Part 8 reports IKE_AUTH split into six fragments on the wire."
  observed: "2026-10-29, strongSwan 6.1.0 ml-dsa @ eb72966d, frame bytes incl. 42 B Ethernet/IP/UDP"
  handshake_frames: 17
  handshake_bytes: 17949
  ike_auth_messages: "12 (6 fragments each way)"

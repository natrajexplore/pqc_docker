id: ssh-kex-downgrade
title: "SSH: server forces classical key exchange (and OpenSSH says so)"
protocol: ssh
stack: ssh
pillar: key-exchange
group: ssh
order: 20
summary: >
  Simulate an old or misconfigured server that only offers curve25519-sha256, while
  the client keeps its post-quantum defaults. Unlike EAP-TLS, SSH does not downgrade
  silently: OpenSSH warns that the connection is not using a post-quantum key exchange.
  (It warns only when the peer imposes the classical choice - forcing it on the client
  side with -o KexAlgorithms is treated as deliberate and stays quiet.) The wire proves
  the classical choice; the verdict goes red.
upstream_lab: learn/ssh
nodes:
  server: pqcw-ssh-server
  client: pqcw-ssh-client
endpoints:
  left:  {name: Client, ip: 172.33.0.3}
  right: {name: Server, ip: 172.33.0.2}
capture:
  agent: pqcw-cap-ssh
  host: ssh-server
  bpf: "tcp port 22"
declared:
  key_exchange: classical
  authentication: classical
  authentication_algorithm: Ed25519
steps:
  - id: keys
    title: Mint Ed25519 host and user keys
    exec:
      - {node: server, cmd: "sh /pqcw/ssh-keys.sh ed25519", timeout: 30}
  - id: sshd
    title: Start sshd offering only classical key exchange
    exec:
      - {node: server, cmd: "if [ -f /run/sshd.pid ]; then kill $(cat /run/sshd.pid); rm -f /run/sshd.pid; fi; sleep 0.3; true"}
      - {node: server, detach: true, cmd: "/usr/local/sbin/sshd -D -e -f /pqcw/sshd_config -o KexAlgorithms=curve25519-sha256 > /tmp/sshd.log 2>&1"}
  - id: sshd-ready
    title: Wait for the listener
    action: wait_for
    wait_for: {node: server, cmd: "ss -ltn", regex: "172.33.0.2:22"}
  - id: capture-start
    title: Start capturing on the server's interface
    action: capture_start
  - id: connect
    title: Connect with default (post-quantum first) client settings
    narration: "The client offers mlkem768x25519-sha256 first; the server's KEXINIT doesn't have it. Watch for the WARNING."
    exec:
      - {node: client, cmd: "install -m 600 /pqcw/ssh_config /tmp/ssh_config && ssh -F /tmp/ssh_config -v pqc-server 'echo PQC-OK' 2>&1", timeout: 20}
    expect: {regex: "PQC-OK"}
  - id: capture-stop
    title: Stop the capture
    action: capture_stop
cleanup:
  - id: stop-sshd
    title: Stop sshd
    exec:
      - {node: server, cmd: "if [ -f /run/sshd.pid ]; then kill $(cat /run/sshd.pid); rm -f /run/sshd.pid; fi; true"}
assertions:
  - {id: kex-wire, kind: ssh.negotiated_kex, expect: {kex: curve25519-sha256}}
  - {id: loud-warning, kind: step_output, expect: {step: connect, regex: 'WARNING: connection is not using a post-quantum key exchange'},
     description: "OpenSSH warns that the session is not post-quantum"}
expected_numbers:
  note: "Compare KEX_ECDH_INIT size with ssh-kex-default: ~32 B vs ~1216 B of key material."
  observed: "2026-10-29, OpenSSH 10.4p1; SSH message sizes are the decoded payloads (exact), frame bytes depend on TCP segmentation"
  kex_ecdh_init_bytes: 44
  kex_ecdh_reply_bytes: 188
  handshake_bytes: 3690

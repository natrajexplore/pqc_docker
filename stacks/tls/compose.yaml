# TLS 1.3 stack (profile: tls). Covers both pillars in one stack:
#   key exchange    X25519MLKEM768 (group 0x11ec) vs classical x25519
#   authentication  ECDSA vs ML-DSA certificates, server-only or mutual TLS
#
# Image: upstream Dockerfile.tls (Debian trixie, OpenSSL 3.5 default provider,
# no oqs-provider). Both containers idle; the orchestrator drives
# `openssl s_server` / `openssl s_client` with docker exec.
#
# IMPORTANT: nodes sit on two networks (tls_net + pqcw_mgmt). Always address the
# peer by its lab IP (172.32.0.2), never by service name: Docker DNS may hand
# back the mgmt address and the handshake would bypass the capture interface.

x-tls-node: &tls-node
  build:
    context: ../../vendor/juliogomez-pqc/learn/docker
    dockerfile: Dockerfile.tls
  image: pqcw/openssl:3.5
  profiles: ["tls"]
  cap_add: [NET_RAW]
  security_opt: [no-new-privileges:true]
  volumes:
    - ./tls-pki.sh:/pqcw/tls-pki.sh:ro
    - pqcw_tls_pki:/pki

services:
  tls-server:
    <<: *tls-node
    container_name: pqcw-tls-server
    hostname: tls-server
    networks:
      tls_net:
        ipv4_address: 172.32.0.2
      pqcw_mgmt:

  tls-client:
    <<: *tls-node
    container_name: pqcw-tls-client
    hostname: tls-client
    networks:
      tls_net:
        ipv4_address: 172.32.0.3
      pqcw_mgmt:
    depends_on:
      - tls-server

  cap-tls:
    image: pqcw/capture-agent:latest
    build:
      context: ../../capture-agent
    container_name: pqcw-cap-tls
    profiles: ["tls"]
    network_mode: "service:tls-server"
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ../../.env
        required: false  # PQCW_AGENT_TOKEN
    environment:
      AGENT_NAME: cap-tls
      LAB_SUBNET: 172.32.0.0/24
      MGMT_SUBNET: 172.29.0.0/24
      CAPTURE_DIR: /captures
    volumes:
      - pqcw_captures:/captures
    depends_on:
      - tls-server

networks:
  tls_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/24
  pqcw_mgmt:
    external: true
    name: pqcw_mgmt

volumes:
  pqcw_captures:
    external: true
    name: pqcw_captures
  pqcw_tls_pki:
    name: pqcw_tls_pki

# IKEv2 mutual certificate authentication - responder (172.31.0.3).
connections {
    auth-tunnel {
        local_addrs  = 172.31.0.3
        proposals    = aes256gcm16-prfsha256-x25519-ke1_mlkem768
        fragmentation = yes
        local {
            auth  = pubkey
            certs = responder.crt
            id    = responder.pqcw.lab
        }
        remote {
            auth = pubkey
            id   = initiator.pqcw.lab
        }
        children {
            auth-child {
                local_ts     = 172.31.0.3/32
                remote_ts    = 172.31.0.2/32
                esp_proposals = aes256gcm16
            }
        }
    }
}

# IKEv2 mutual certificate authentication - initiator (172.31.0.2).
# Key exchange stays hybrid (X25519 + ML-KEM-768) in every run; only the
# certificates installed by /pqcw/pki.sh change (ECDSA, ML-DSA-44, ML-DSA-65).
connections {
    auth-tunnel {
        local_addrs  = 172.31.0.2
        remote_addrs = 172.31.0.3
        proposals    = aes256gcm16-prfsha256-x25519-ke1_mlkem768
        # Required twice over: ML-KEM in IKE_INTERMEDIATE, and ML-DSA certs +
        # signatures in IKE_AUTH (expect several SKF fragments per direction).
        fragmentation = yes
        local {
            auth  = pubkey
            certs = initiator.crt
            id    = initiator.pqcw.lab
        }
        remote {
            auth = pubkey
            id   = responder.pqcw.lab
        }
        children {
            auth-child {
                local_ts     = 172.31.0.2/32
                remote_ts    = 172.31.0.3/32
                esp_proposals = aes256gcm16
                start_action = none
            }
        }
    }
}

# Variant: hybrid X25519 (IKE_SA_INIT) + ML-KEM-768 as RFC 9370 additional key
# exchange #1, carried in an RFC 9242 IKE_INTERMEDIATE exchange. The 1184-byte
# encapsulation key exceeds the 1280-byte IKE message budget, so RFC 7383
# fragmentation is required.
connections {
    pqc-tunnel {
        local_addrs  = 172.30.0.2
        remote_addrs = 172.30.0.3
        proposals    = aes256gcm16-prfsha256-x25519-ke1_mlkem768
        fragmentation = yes
        local  { auth = psk }
        remote { auth = psk }
        children {
            pqc-child {
                local_ts     = 172.30.0.2/32
                remote_ts    = 172.30.0.3/32
                # CHILD_SA rekeys also go hybrid when PFS is configured
                esp_proposals = aes256gcm16-x25519-ke1_mlkem768
                start_action = none
            }
        }
    }
}
include /run/pqcw/secrets.conf

# Variant: classical baseline - X25519 only, no post-quantum component.
# Harvest-now-decrypt-later exposed. Used as the comparison baseline.
connections {
    pqc-tunnel {
        local_addrs  = 172.30.0.2
        remote_addrs = 172.30.0.3
        proposals    = aes256gcm16-prfsha256-x25519
        fragmentation = yes
        local  { auth = psk }
        remote { auth = psk }
        children {
            pqc-child {
                local_ts     = 172.30.0.2/32
                remote_ts    = 172.30.0.3/32
                esp_proposals = aes256gcm16-x25519
                start_action = none
            }
        }
    }
}
include /run/pqcw/secrets.conf

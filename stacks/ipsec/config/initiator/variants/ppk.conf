# Variant: RFC 8784 post-quantum preshared key. Classical X25519 on the wire,
# but a static high-entropy PPK is mixed into the key schedule, so the session
# keys survive a broken (EC)DH. Quantum safety with no new algorithm: watch for
# the USE_PPK / PPK_IDENTITY notifies and the absence of IKE_INTERMEDIATE.
connections {
    pqc-tunnel {
        local_addrs  = 172.30.0.2
        remote_addrs = 172.30.0.3
        proposals    = aes256gcm16-prfsha256-x25519
        fragmentation = yes
        ppk_id       = pqcw-ppk
        ppk_required = yes
        local  { auth = psk }
        remote { auth = psk }
        children {
            pqc-child {
                local_ts     = 172.30.0.2/32
                remote_ts    = 172.30.0.3/32
                esp_proposals = aes256gcm16
                start_action = none
            }
        }
    }
}
include /run/pqcw/secrets.conf

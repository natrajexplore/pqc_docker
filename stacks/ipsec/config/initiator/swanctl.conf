# Initiator (172.30.0.2) - loaded by the upstream entrypoint at start-up.
# Default posture is the hybrid X25519 + ML-KEM-768 variant. The orchestrator
# swaps postures at run time with:
#   swanctl --load-all --file /usr/local/etc/swanctl/variants/<variant>.conf
# swanctl unloads any connection that is not in the newly loaded file, so every
# variant reuses the same names (conn pqc-tunnel, child pqc-child).
include variants/hybrid-mlkem768.conf

# Variant: RFC 8784 PPK (responder side). See initiator/variants/ppk.conf.
connections {
    pqc-tunnel {
        local_addrs  = 172.30.0.3
        proposals    = aes256gcm16-prfsha256-x25519
        fragmentation = yes
        ppk_id       = pqcw-ppk
        ppk_required = yes
        local  { auth = psk }
        remote { auth = psk }
        children {
            pqc-child {
                local_ts     = 172.30.0.3/32
                remote_ts    = 172.30.0.2/32
                esp_proposals = aes256gcm16
            }
        }
    }
}
include /run/pqcw/secrets.conf

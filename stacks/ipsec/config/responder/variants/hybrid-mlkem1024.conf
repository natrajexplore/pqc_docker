# Variant: hybrid X25519 + ML-KEM-1024 (responder side). See initiator/variants/hybrid-mlkem1024.conf.
connections {
    pqc-tunnel {
        local_addrs  = 172.30.0.3
        proposals    = aes256gcm16-prfsha384-x25519-ke1_mlkem1024
        fragmentation = yes
        local  { auth = psk }
        remote { auth = psk }
        children {
            pqc-child {
                local_ts     = 172.30.0.3/32
                remote_ts    = 172.30.0.2/32
                esp_proposals = aes256gcm16-x25519-ke1_mlkem1024
            }
        }
    }
}
include /run/pqcw/secrets.conf

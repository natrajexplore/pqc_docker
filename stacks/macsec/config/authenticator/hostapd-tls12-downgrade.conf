# hostapd: the SILENT DOWNGRADE posture. Identical to hostapd-tls13.conf except
# tls_flags is absent, so hostapd's default (TLS 1.3 disabled for EAP) applies.
# EAP still reports CTRL-EVENT-EAP-SUCCESS, but the handshake is TLS 1.2 ECDHE
# with no ML-KEM at all. The UI must flag this run red even though it "worked".
interface=aut
driver=wired
ieee8021x=1
eap_server=1
eap_user_file=/pqcw/cfg/eap_user
ca_cert=/pki/active/ca.crt
server_cert=/pki/active/server.crt
private_key=/pki/active/server.key
# tls_flags intentionally omitted

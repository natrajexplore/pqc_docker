# hostapd: 802.1X authenticator ("switch port") with integrated EAP-TLS server,
# pinned to TLS 1.3 so the hybrid X25519MLKEM768 group is actually used.
# Adapted from juliogomez/pqc learn/macsec (MIT).
#   hostapd -dd /pqcw/cfg/hostapd-tls13.conf > /tmp/hostapd.log 2>&1 &
interface=aut
driver=wired
ieee8021x=1
eap_server=1
eap_user_file=/pqcw/cfg/eap_user

# /pki/active is a symlink set by `tls-pki.sh activate <algo>` (ecdsa | ml-dsa-*).
ca_cert=/pki/active/ca.crt
server_cert=/pki/active/server.crt
private_key=/pki/active/server.key

# hostapd disables TLS 1.3 for EAP by default (TLS_CONN_DISABLE_TLSv1_3). Without
# this line the handshake silently falls back to classical TLS 1.2 ECDHE.
tls_flags=[ENABLE-TLSv1.3][DISABLE-TLSv1.0][DISABLE-TLSv1.1][DISABLE-TLSv1.2]

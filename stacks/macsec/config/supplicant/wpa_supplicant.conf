# wpa_supplicant: 802.1X supplicant ("endpoint") on the sup end of the veth.
# Adapted from juliogomez/pqc learn/macsec (MIT).
#   wpa_supplicant -Dwired -isup -c /pqcw/cfg/wpa_supplicant.conf -t -dd > /tmp/wpa.log 2>&1 &
ctrl_interface=/run/wpa
eapol_version=2
ap_scan=0
fast_reauth=0

network={
    key_mgmt=IEEE8021X
    eap=TLS
    identity="client.pqcw.lab"
    ca_cert="/pki/active/ca.crt"
    client_cert="/pki/active/client.crt"
    private_key="/pki/active/client.key"
    eapol_flags=0
}

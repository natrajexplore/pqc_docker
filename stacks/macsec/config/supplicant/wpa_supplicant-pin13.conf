# wpa_supplicant with TLS 1.3 PINNED on the client (defence in depth).
# Against the downgrade hostapd posture this turns a silent TLS 1.2 fallback into
# a loud failure (protocol_version alert, no ServerHello) - the behaviour you want.
ctrl_interface=/run/wpa
eapol_version=2
ap_scan=0
fast_reauth=0

network={
    key_mgmt=IEEE8021X
    eap=TLS
    identity="client.pqcw.lab"
    ca_cert="/pki/active/ca.crt"
    client_cert="/pki/active/client.crt"
    private_key="/pki/active/client.key"
    phase1="tls_disable_tlsv1_0=1 tls_disable_tlsv1_1=1 tls_disable_tlsv1_2=1"
    eapol_flags=0
}

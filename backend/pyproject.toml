[project]
name = "pqcw-backend"
version = "0.1.0"
description = "PQC WireScope API: scenario orchestrator, capture fan-in and post-quantum handshake analyzer"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pyyaml==6.0.2",
  "docker==7.1.0",
  "httpx==0.28.1",
  "websockets==14.1",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.0", "ruff==0.8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI's File()/Query() defaults are idiomatic. B905: zip lengths are checked by hand.
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]   # I / R as initiator / responder IPs read better than anything longer
